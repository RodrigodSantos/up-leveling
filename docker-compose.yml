services:
  postgres:
    image: postgres:17-alpine
    container_name: up-leveling-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-upleveling}
      POSTGRES_USER: ${DB_USER:-upleveling}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-upleveling}
    ports:
      # 5434 no host: a 5432 é do PostgreSQL instalado no Windows e a 5433 de outro projeto
      - "5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-upleveling}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # A API em container (opcional): docker compose --profile app up --build
  api:
    build: .
    container_name: up-leveling-api
    profiles: ["app"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-upleveling}
      DB_USER: ${DB_USER:-upleveling}
      DB_PASSWORD: ${DB_PASSWORD:-upleveling}
      # demo: cria a conta demo@upleveling.local / demo1234 com dados prontos
      SPRING_PROFILES_ACTIVE: demo
    ports:
      - "8080:8080"

volumes:
  postgres-data:
