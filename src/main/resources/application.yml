server:
  # Plataformas de hospedagem (ex.: Render) informam a porta pela variável PORT
  port: ${PORT:8080}

spring:
  application:
    name: up-leveling
  datasource:
    # Os padrões batem com o docker-compose.yml; em produção, vêm das variáveis de ambiente
    url: ${DB_URL:jdbc:postgresql://localhost:5434/upleveling}
    username: ${DB_USER:upleveling}
    password: ${DB_PASSWORD:upleveling}
  jpa:
    hibernate:
      # O Flyway é dono do schema; o Hibernate só confere se as entidades batem com ele
      ddl-auto: validate
    open-in-view: false
  mvc:
    problemdetails:
      enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info

upleveling:
  # Fuso que define o "hoje" dos check-ins (todos os usuários seguem o mesmo)
  time-zone: ${APP_TIME_ZONE:America/Sao_Paulo}
  cors:
    # Endereços do frontend que podem chamar a API, separados por vírgula (5173 = Vite em desenvolvimento)
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    # Em produção, definir JWT_SECRET com no mínimo 32 caracteres aleatórios.
    # O valor padrão serve só para desenvolvimento local.
    secret: ${JWT_SECRET:dev-only-segredo-local-troque-em-producao-123456}
    expiration: ${JWT_EXPIRATION:1h}
